<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배달맵 v0.6</title><style>body{margin:0;font:15px system-ui,sans-serif;color:#182536}header{background:#153b65;color:white;padding:12px 18px}h1{font-size:20px;margin:0}.wrap{display:grid;grid-template-columns:370px 1fr;height:calc(100vh - 56px)}aside{overflow:auto;padding:14px;border-right:1px solid #ddd}#map{height:100%;min-height:400px}.line{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}input,button,select{padding:8px;border:1px solid #b9c5d2;border-radius:6px;font:inherit}input[type=text]{min-width:0;flex:1}button{background:#f2f6fa;cursor:pointer}button.primary{background:#1768b2;color:white}small{color:#617182}.building{border:1px solid #d5dfe8;border-radius:9px;margin:8px 0;padding:10px}.building h3{font-size:15px;margin:0 0 5px}.item{padding:7px 0;border-top:1px solid #eee}.item button{padding:4px 6px;font-size:12px}.pill{font-size:12px;padding:2px 6px;border-radius:9px;background:#e8eff7}.error{color:#aa3030}.ok{color:#167047}#notice{white-space:pre-wrap}label{font-size:13px}.routebox{background:#eef5fc;border:1px solid #c7d8ea;border-radius:9px;padding:10px;margin:10px 0}.routebox button{margin:3px}.routeitem{padding:6px;border-bottom:1px solid #d5e2ee}.routeitem button{padding:2px 6px}.selected{outline:3px solid #e99525}.muted{color:#64748b} @media(max-width:750px){.wrap{display:block;height:auto}aside{max-height:53vh}#map{height:47vh;min-height:310px}}</style></head><body><header><h1>배달맵 <small style="color:#cbdff5">v0.6 · 지도에서 배송순서 지정</small></h1></header><div class="wrap"><aside><b>1. 지도 연결</b><p id="notice">카카오 지도를 자동으로 연결하는 중입니다.</p><hr><b>2. 배송 경로</b><div class="routebox"><div id="routeState">배송목록을 불러오세요.</div><div class="line"><button id="startRoute" class="primary">지도에서 순서 정하기</button><button id="editRoute">저장된 경로 수정</button><button id="saveRoute" class="primary">경로 저장</button><button id="cancelRoute">수정 취소</button></div><div class="line"><button id="undoRoute">마지막 선택 취소</button><button id="clearRoute">선택 초기화</button><button id="restoreRoute">이전 경로 복원</button></div><div id="routeList"></div><small>지도에서 건물을 순서대로 클릭하세요. 같은 건물의 여러 배송은 한 번만 선택합니다. 저장된 경로는 다음 접속에도 유지됩니다(현재 브라우저).</small></div><hr><b>3. 배송 목록</b><div class="line"><button id="sample">샘플 30건 (목표 16곳)</button><input id="csv" type="file" accept=".csv,text/csv"><button id="reset">상태 초기화</button></div><small>CSV 첫 줄: 수령인,배송대상,주소,상세주소,수량,배달순서. UTF-8 권장. 같은 건물은 동일한 기본주소로 입력하세요.</small><div class="line"><label><input type="checkbox" id="hide"> 처리 완료 건물 숨기기</label></div><p id="stats"></p><div id="list"></div></aside><div id="map" aria-label="카카오 지도"></div></div><script>
const KAKAO_JS_KEY = '여기에_카카오_JavaScript_키_입력';
const $=id=>document.getElementById(id);let map,geocoder,markers=[],records=[],groups=[];const SAMPLE_ADDR='서울 종로구 사직로8길 4';const food=[["청진옥","서울 종로구 종로3길 32"],["광화문미진","서울 종로구 종로 19"],["광화문국밥","서울 중구 세종대로21길 53"],["우육면관 광화문점","서울 종로구 종로7길 29-14"],["무탄 광화문점","서울 종로구 새문안로 68"],["우아라","서울 종로구 종로1길 50"],["해목 경복궁점","서울 종로구 자하문로 26-1"],["칸다소바 경복궁점","서울 종로구 자하문로7길 5"],["광화문뚝감","서울 종로구 새문안로3길 21"],["모던샤브하우스 광화문점","서울 종로구 종로3길 17"],["종로도담","서울 종로구 삼봉로 78"],["잘빠진메밀 서촌본점","서울 종로구 자하문로11길 4"],["서촌계단집","서울 종로구 자하문로1길 15"],["만석꾼","서울 종로구 자하문로2길 9"],["서촌전통순대국","서울 종로구 사직로9가길 8"]];const geoCache=new Map();
function status(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':'ok'}
function loadSdk(){const key=KAKAO_JS_KEY.trim();if(!key||key==='여기에_카카오_JavaScript_키_입력')return status('초기 설정이 필요합니다. GitHub의 index.html에서 KAKAO_JS_KEY에 JavaScript 키를 한 번만 입력해 주세요.',true);if(window.kakao?.maps){initMap();return}let old=document.getElementById('kakao-sdk');if(old)old.remove();const s=document.createElement('script');s.id='kakao-sdk';s.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(key);s.onload=()=>{if(!window.kakao?.maps)return status('SDK를 불러오지 못했습니다. 키와 앱 설정을 확인하세요.',true);kakao.maps.load(initMap)};s.onerror=()=>status('카카오 SDK 로딩 실패: 키, 등록 도메인, 카카오맵 사용 권한을 확인하세요.',true);document.head.appendChild(s)}
function initMap(){map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.572,126.976),level:5});geocoder=new kakao.maps.services.Geocoder();status('지도 연결 완료. 배송목록을 불러오세요.');if(records.length)geocodeAll()}
function sample(){records=[];food.forEach((f,i)=>records.push({id:'s'+i,name:f[0],product:i%3===0?'신문 A':'신문 B',address:f[1],detail:'식당 배송 · 가상 주문',qty:1,order:i+1,state:'대기',reason:''}));for(let i=0;i<15;i++)records.push({id:'a'+i,name:'가상 수령인 '+(i+1),product:i%2?'신문 A':'신문 B',address:SAMPLE_ADDR,detail:'101동 '+(101+i)+'호 (가상)',qty:1,order:16+i,state:'대기',reason:''});activateDataset();status('샘플 30건 등록: 서로 다른 주소의 식당 15곳 + 아파트 15세대(한 건물). 주문과 수령인은 가상입니다.');render();if(map)geocodeAll()}
function parseCsv(txt){let lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/);function cells(line){let out=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){out.push(v);v=''}else v+=c}out.push(v);return out}let header=cells(lines.shift()).map(s=>s.trim());let idx=(...names)=>header.findIndex(x=>names.includes(x));let get=(a,n)=>{let k=idx(...n);return k<0?'':(a[k]||'').trim()};records=lines.filter(Boolean).map((l,i)=>{let a=cells(l);return{id:'c'+i,name:get(a,['수령인','독자명','이름'])||'수령인 '+(i+1),product:get(a,['배송대상','배달신문','신문명','품목'])||'배송물품',address:get(a,['주소','도로명주소']),detail:get(a,['상세주소','동호수']),qty:Number(get(a,['수량','부수']))||1,order:Number(get(a,['배달순서','순서']))||i+1,state:'대기',reason:''}}).filter(x=>x.address);activateDataset();render();status('CSV '+records.length+'건 등록');if(map)geocodeAll()}
function normalize(a){return a.trim().replace(/\s+/g,' ')}
function activateDataset(){const addresses=[...new Set(records.map(r=>normalize(r.address)))].sort();datasetKey='baedal-route-v06:'+addresses.join('|');let raw=localStorage.getItem(datasetKey);try{let obj=raw?JSON.parse(raw):{};savedRoute=Array.isArray(obj.route)?obj.route.filter(x=>addresses.includes(x)):[];previousRoute=Array.isArray(obj.previous)?obj.previous.filter(x=>addresses.includes(x)):[]}catch(e){savedRoute=[];previousRoute=[]}routeMode=false;routeDraft=[];updateRouteUI()}
function routeOrder(){return routeMode?routeDraft:savedRoute}
function beginRoute(edit){if(!records.length)return alert('먼저 배송목록을 불러오세요.');if(edit){if(!savedRoute.length)return alert('저장된 경로가 없습니다. 먼저 경로를 정하세요.');if(!confirm('배송경로를 수정하시겠습니까?\n저장하면 이후 배송에도 변경된 순서가 적용됩니다.\n기존 경로는 복원을 위해 보관됩니다.'))return;routeDraft=[...savedRoute]}else{if(savedRoute.length)return alert('이미 저장된 경로가 있습니다. 「저장된 경로 수정」을 사용하세요.');routeDraft=[]}routeMode=true;updateRouteUI();drawMarkers()}
function selectBuilding(address){if(!routeMode)return;const a=normalize(address);if(routeDraft.includes(a)){alert('이미 선택한 건물입니다. 순서를 바꾸려면 목록에서 제거한 뒤 다시 선택하세요.');return}routeDraft.push(a);updateRouteUI();drawMarkers()}
function saveRoute(){if(!routeMode)return;if(routeDraft.length!==groups.length)return alert(`전체 ${groups.length}개 건물 중 ${routeDraft.length}개를 선택했습니다. 모든 건물을 선택한 뒤 저장해 주세요.`);previousRoute=[...savedRoute];savedRoute=[...routeDraft];localStorage.setItem(datasetKey,JSON.stringify({route:savedRoute,previous:previousRoute}));routeMode=false;routeDraft=[];updateRouteUI();render();drawMarkers();alert('배송경로가 저장되었습니다. 다음 접속에도 순서가 유지됩니다.')}
function updateRouteUI(){const ordered=routeOrder();$('routeState').textContent=routeMode?`경로 지정 중: ${ordered.length}/${groups.length}개 건물 선택`:(savedRoute.length?`저장된 배송경로: ${savedRoute.length}개 건물 · 수정하지 않으면 유지됩니다.`:'저장된 배송경로 없음 · 지도에서 순서를 정하세요.');$('startRoute').disabled=!records.length||!!savedRoute.length||routeMode;$('editRoute').disabled=!savedRoute.length||routeMode;$('saveRoute').disabled=!routeMode;$('cancelRoute').disabled=!routeMode;$('undoRoute').disabled=!routeMode||!routeDraft.length;$('clearRoute').disabled=!routeMode||!routeDraft.length;$('restoreRoute').disabled=routeMode||!previousRoute.length;let root=$('routeList');root.replaceChildren();ordered.forEach((addr,i)=>{let d=document.createElement('div');d.className='routeitem';let t=document.createElement('span');t.textContent=`${i+1}. ${addr} `;d.append(t);if(routeMode){let b=document.createElement('button');b.textContent='제거';b.onclick=()=>{routeDraft.splice(i,1);updateRouteUI();drawMarkers()};d.append(b)}root.append(d)})}
function groupData(){let m=new Map;records.sort((a,b)=>a.order-b.order).forEach(r=>{let key=r.address.trim().replace(/\s+/g,' ');if(!m.has(key)){let p=geoCache.get(key);m.set(key,{address:key,items:[],lat:p?.lat??null,lng:p?.lng??null})};m.get(key).items.push(r)});groups=[...m.values()];const order=routeOrder();if(order.length)groups.sort((a,b)=>{let x=order.indexOf(a.address),y=order.indexOf(b.address);return (x<0?9999:x)-(y<0?9999:y)})}
function groupStatus(g){let n=g.items.filter(x=>x.state!=='대기').length;return n===0?'대기':n===g.items.length?'완료':'일부'}
function render(){groupData();updateRouteUI();let processed=records.filter(x=>x.state!=='대기').length;$('stats').textContent=`배송 ${records.length}건 · 건물 ${groups.length}곳 · 처리 ${processed}건`+(records.length===30?' · '+(groups.length===16?'16곳 묶음 확인':'16곳 기준 확인 필요'):'');let root=$('list');root.replaceChildren();groups.forEach((g,i)=>{if($('hide').checked&&groupStatus(g)==='완료')return;let box=document.createElement('div');box.className='building';box.dataset.address=g.address;let h=document.createElement('h3');let st=groupStatus(g),bad=g.items.some(x=>x.state==='배송불가');h.textContent=`${i+1}. ${g.address} · ${st==='완료'?'배송완료'+(bad?' (배송불가 존재)':''):st==='일부'?'일부 처리':'대기'}`;box.append(h);g.items.forEach(r=>{let line=document.createElement('div');line.className='item';let name=document.createElement('div');name.textContent=`${r.name} — ${r.product} (${r.qty}) ${r.detail} · ${r.state}${r.reason?' ['+r.reason+']':''}`;line.append(name);for(let [text,value] of [['완료','배송완료'],['불가','배송불가'],['대기','대기']]){let b=document.createElement('button');b.textContent=text;b.onclick=()=>{let reason=value==='배송불가'?prompt('배송불가 사유를 입력하세요','부재'):' ';if(reason===null)return;r.state=value;r.reason=value==='배송불가'?reason.trim():'';render();drawMarkers()};line.append(b)}box.append(line)});box.onclick=e=>{if(e.target.tagName==='BUTTON')return;if(routeMode)selectBuilding(g.address);if(map&&g.lat!==null)map.panTo(new kakao.maps.LatLng(g.lat,g.lng))};root.append(box)})}
function drawMarkers(){markers.forEach(m=>m.setMap(null));markers=[];if(routeLine){routeLine.setMap(null);routeLine=null}if(!map)return;groupData();const order=routeOrder(),path=[];for(const address of order){let g=groups.find(x=>x.address===address);if(g&&g.lat!==null)path.push(new kakao.maps.LatLng(g.lat,g.lng))}if(path.length>1){routeLine=new kakao.maps.Polyline({path,strokeWeight:4,strokeColor:'#e05d35',strokeOpacity:.85,strokeStyle:'solid'});routeLine.setMap(map)}groups.forEach((g,i)=>{if(g.lat===null||($('hide').checked&&groupStatus(g)==='완료'))return;let st=groupStatus(g),color=st==='완료'?'#199b59':st==='일부'?'#e99525':'#2875c8';let seq=order.indexOf(g.address),number=seq>=0?seq+1:'+';let el=document.createElement('button');el.type='button';el.title=routeMode?'클릭하여 배송순서 지정':g.address;el.textContent=`${number} · ${g.items.length}`;el.style.cssText=`background:${color};color:white;border-radius:20px;padding:5px 9px;border:2px solid ${routeMode&&seq>=0?'#fbbf24':'white'};box-shadow:0 1px 5px #777;font-weight:bold;cursor:pointer`;el.onclick=()=>{if(routeMode)selectBuilding(g.address);else{let nodes=[...document.querySelectorAll('.building')];let node=nodes.find(n=>n.dataset.address===g.address);if(node)node.scrollIntoView({behavior:'smooth',block:'nearest'})}};let overlay=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(g.lat,g.lng),content:el,clickable:true,yAnchor:1});overlay.setMap(map);markers.push(overlay)})}
async function geocodeAll(){if(!geocoder)return;groupData();let bounds=new kakao.maps.LatLngBounds(),success=0,failed=[];for(let g of groups){let result=await new Promise(resolve=>geocoder.addressSearch(g.address,(arr,status)=>resolve(status===kakao.maps.services.Status.OK?arr[0]:null)));if(result){g.lat=Number(result.y);g.lng=Number(result.x);geoCache.set(g.address,{lat:g.lat,lng:g.lng});bounds.extend(new kakao.maps.LatLng(g.lat,g.lng));success++}else failed.push(g.address)}drawMarkers();if(success)map.setBounds(bounds);status(`주소검색 ${success}/${groups.length}개 건물 성공`+(failed.length?'\n실패 주소: '+failed.join(', '):''),failed.length>0)}
window.addEventListener('DOMContentLoaded',loadSdk);$('sample').onclick=sample;$('hide').onchange=()=>{render();drawMarkers()};$('reset').onclick=()=>{if(!confirm('모든 배송 상태를 대기로 초기화할까요?'))return;records.forEach(r=>{r.state='대기';r.reason=''});render();drawMarkers()};$('startRoute').onclick=()=>beginRoute(false);$('editRoute').onclick=()=>beginRoute(true);$('saveRoute').onclick=saveRoute;$('cancelRoute').onclick=()=>{routeMode=false;routeDraft=[];updateRouteUI();render();drawMarkers()};$('undoRoute').onclick=()=>{routeDraft.pop();updateRouteUI();drawMarkers()};$('clearRoute').onclick=()=>{if(confirm('현재 선택한 순서를 모두 지울까요? 저장된 경로에는 영향을 주지 않습니다.')){routeDraft=[];updateRouteUI();drawMarkers()}};$('restoreRoute').onclick=()=>{if(!previousRoute.length||!confirm('이전 배송경로로 복원할까요? 현재 경로는 복원 이력으로 보관됩니다.'))return;let t=savedRoute;savedRoute=previousRoute;previousRoute=t;localStorage.setItem(datasetKey,JSON.stringify({route:savedRoute,previous:previousRoute}));render();drawMarkers()};$('csv').onchange=async e=>{let f=e.target.files[0];if(f)parseCsv(await f.text())};
</script></body></html>
