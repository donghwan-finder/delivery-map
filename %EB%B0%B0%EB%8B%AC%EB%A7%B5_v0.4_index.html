<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배달맵 v0.4</title><style>body{margin:0;font:15px system-ui,sans-serif;color:#182536}header{background:#153b65;color:white;padding:12px 18px}h1{font-size:20px;margin:0}.wrap{display:grid;grid-template-columns:370px 1fr;height:calc(100vh - 56px)}aside{overflow:auto;padding:14px;border-right:1px solid #ddd}#map{height:100%;min-height:400px}.line{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}input,button,select{padding:8px;border:1px solid #b9c5d2;border-radius:6px;font:inherit}input[type=text]{min-width:0;flex:1}button{background:#f2f6fa;cursor:pointer}button.primary{background:#1768b2;color:white}small{color:#617182}.building{border:1px solid #d5dfe8;border-radius:9px;margin:8px 0;padding:10px}.building h3{font-size:15px;margin:0 0 5px}.item{padding:7px 0;border-top:1px solid #eee}.item button{padding:4px 6px;font-size:12px}.pill{font-size:12px;padding:2px 6px;border-radius:9px;background:#e8eff7}.error{color:#aa3030}.ok{color:#167047}#notice{white-space:pre-wrap}label{font-size:13px} @media(max-width:750px){.wrap{display:block;height:auto}aside{max-height:53vh}#map{height:47vh;min-height:310px}}</style></head><body><header><h1>배달맵 <small style="color:#cbdff5">v0.4 · 16개 건물 테스트</small></h1></header><div class="wrap"><aside><b>1. 카카오 JavaScript 키</b><div class="line"><input id="key" type="text" placeholder="JavaScript 키를 이 기기에서만 입력"><button id="connect" class="primary">지도 연결</button></div><small>REST API 키가 아닌 JavaScript 키를 사용하세요. 키는 서버로 별도 전송하거나 GitHub에 저장하지 않습니다. 카카오 SDK 호출에만 사용됩니다.</small><p id="notice">지도 연결 후 샘플 데이터를 불러오세요.</p><hr><b>2. 배송 목록</b><div class="line"><button id="sample">샘플 30건 (목표 16곳)</button><input id="csv" type="file" accept=".csv,text/csv"><button id="reset">상태 초기화</button></div><small>CSV 첫 줄: 수령인,배송대상,주소,상세주소,수량,배달순서. UTF-8 권장. 같은 건물은 동일한 기본주소로 입력하세요.</small><div class="line"><label><input type="checkbox" id="hide"> 처리 완료 건물 숨기기</label></div><p id="stats"></p><div id="list"></div></aside><div id="map" aria-label="카카오 지도"></div></div><script>
const $=id=>document.getElementById(id);let map,geocoder,markers=[],records=[],groups=[];const SAMPLE_ADDR='서울 종로구 사직로8길 4';const food=[["청진옥","서울 종로구 종로3길 32"],["광화문미진","서울 종로구 종로 19"],["광화문국밥","서울 중구 세종대로21길 53"],["우육면관 광화문점","서울 종로구 종로7길 29-14"],["무탄 광화문점","서울 종로구 새문안로 68"],["우아라","서울 종로구 종로1길 50"],["해목 경복궁점","서울 종로구 자하문로 26-1"],["칸다소바 경복궁점","서울 종로구 자하문로7길 5"],["광화문뚝감","서울 종로구 새문안로3길 21"],["모던샤브하우스 광화문점","서울 종로구 종로3길 17"],["종로도담","서울 종로구 삼봉로 78"],["잘빠진메밀 서촌본점","서울 종로구 자하문로11길 4"],["서촌계단집","서울 종로구 자하문로1길 15"],["만석꾼","서울 종로구 자하문로2길 9"],["서촌전통순대국","서울 종로구 사직로9가길 8"]];const geoCache=new Map();
function status(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':'ok'}
function loadSdk(){const key=$('key').value.trim();if(!key)return status('JavaScript 키를 입력하세요.',true);if(window.kakao?.maps){initMap();return}let old=document.getElementById('kakao-sdk');if(old)old.remove();const s=document.createElement('script');s.id='kakao-sdk';s.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+encodeURIComponent(key);s.onload=()=>{if(!window.kakao?.maps)return status('SDK를 불러오지 못했습니다. 키와 앱 설정을 확인하세요.',true);kakao.maps.load(initMap)};s.onerror=()=>status('카카오 SDK 로딩 실패: 키, 등록 도메인, 카카오맵 사용 권한을 확인하세요.',true);document.head.appendChild(s)}
function initMap(){map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.572,126.976),level:5});geocoder=new kakao.maps.services.Geocoder();status('지도 연결 완료. 샘플 30건을 불러오세요.');if(records.length)geocodeAll()}
function sample(){records=[];food.forEach((f,i)=>records.push({id:'s'+i,name:f[0],product:i%3===0?'신문 A':'신문 B',address:f[1],detail:'식당 배송 · 가상 주문',qty:1,order:i+1,state:'대기',reason:''}));for(let i=0;i<15;i++)records.push({id:'a'+i,name:'가상 수령인 '+(i+1),product:i%2?'신문 A':'신문 B',address:SAMPLE_ADDR,detail:'101동 '+(101+i)+'호 (가상)',qty:1,order:16+i,state:'대기',reason:''});status('샘플 30건 등록: 서로 다른 주소의 식당 15곳 + 아파트 15세대(한 건물). 주문과 수령인은 가상입니다.');render();if(map)geocodeAll()}
function parseCsv(txt){let lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/);function cells(line){let out=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){out.push(v);v=''}else v+=c}out.push(v);return out}let header=cells(lines.shift()).map(s=>s.trim());let idx=(...names)=>header.findIndex(x=>names.includes(x));let get=(a,n)=>{let k=idx(...n);return k<0?'':(a[k]||'').trim()};records=lines.filter(Boolean).map((l,i)=>{let a=cells(l);return{id:'c'+i,name:get(a,['수령인','독자명','이름'])||'수령인 '+(i+1),product:get(a,['배송대상','배달신문','신문명','품목'])||'배송물품',address:get(a,['주소','도로명주소']),detail:get(a,['상세주소','동호수']),qty:Number(get(a,['수량','부수']))||1,order:Number(get(a,['배달순서','순서']))||i+1,state:'대기',reason:''}}).filter(x=>x.address);render();status('CSV '+records.length+'건 등록');if(map)geocodeAll()}
function groupData(){let m=new Map;records.sort((a,b)=>a.order-b.order).forEach(r=>{let key=r.address.trim().replace(/\s+/g,' ');if(!m.has(key)){let p=geoCache.get(key);m.set(key,{address:key,items:[],lat:p?.lat??null,lng:p?.lng??null})};m.get(key).items.push(r)});groups=[...m.values()]}
function groupStatus(g){let n=g.items.filter(x=>x.state!=='대기').length;return n===0?'대기':n===g.items.length?'완료':'일부'}
function render(){groupData();let processed=records.filter(x=>x.state!=='대기').length;$('stats').textContent=`배송 ${records.length}건 · 건물 ${groups.length}곳 · 처리 ${processed}건`+(records.length===30?' · '+(groups.length===16?'16곳 묶음 확인':'16곳 기준 확인 필요'):'');let root=$('list');root.replaceChildren();groups.forEach((g,i)=>{if($('hide').checked&&groupStatus(g)==='완료')return;let box=document.createElement('div');box.className='building';let h=document.createElement('h3');let st=groupStatus(g),bad=g.items.some(x=>x.state==='배송불가');h.textContent=`${i+1}. ${g.address} · ${st==='완료'?'배송완료'+(bad?' (배송불가 존재)':''):st==='일부'?'일부 처리':'대기'}`;box.append(h);g.items.forEach(r=>{let line=document.createElement('div');line.className='item';let name=document.createElement('div');name.textContent=`${r.name} — ${r.product} (${r.qty}) ${r.detail} · ${r.state}${r.reason?' ['+r.reason+']':''}`;line.append(name);for(let [text,value] of [['완료','배송완료'],['불가','배송불가'],['대기','대기']]){let b=document.createElement('button');b.textContent=text;b.onclick=()=>{let reason=value==='배송불가'?prompt('배송불가 사유를 입력하세요','부재'):' ';if(reason===null)return;r.state=value;r.reason=value==='배송불가'?reason.trim():'';render();drawMarkers()};line.append(b)}box.append(line)});box.onclick=e=>{if(e.target.tagName==='BUTTON'||!map||g.lat===null)return;map.panTo(new kakao.maps.LatLng(g.lat,g.lng))};root.append(box)})}
function drawMarkers(){markers.forEach(m=>m.setMap(null));markers=[];if(!map)return;groups.forEach((g,i)=>{if(g.lat===null||($('hide').checked&&groupStatus(g)==='완료'))return;let st=groupStatus(g),color=st==='완료'?'#199b59':st==='일부'?'#e99525':'#2875c8';let content=`<div style="background:${color};color:white;border-radius:20px;padding:5px 9px;border:2px solid white;box-shadow:0 1px 5px #777;font-weight:bold">${i+1} · ${g.items.length}</div>`;let overlay=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(g.lat,g.lng),content,clickable:true,yAnchor:1});overlay.setMap(map);markers.push(overlay)})}
async function geocodeAll(){if(!geocoder)return;groupData();let bounds=new kakao.maps.LatLngBounds(),success=0,failed=[];for(let g of groups){let result=await new Promise(resolve=>geocoder.addressSearch(g.address,(arr,status)=>resolve(status===kakao.maps.services.Status.OK?arr[0]:null)));if(result){g.lat=Number(result.y);g.lng=Number(result.x);geoCache.set(g.address,{lat:g.lat,lng:g.lng});bounds.extend(new kakao.maps.LatLng(g.lat,g.lng));success++}else failed.push(g.address)}drawMarkers();if(success)map.setBounds(bounds);status(`주소검색 ${success}/${groups.length}개 건물 성공`+(failed.length?'\n실패 주소: '+failed.join(', '):''),failed.length>0)}
$('connect').onclick=loadSdk;$('sample').onclick=sample;$('hide').onchange=()=>{render();drawMarkers()};$('reset').onclick=()=>{if(!confirm('모든 배송 상태를 대기로 초기화할까요?'))return;records.forEach(r=>{r.state='대기';r.reason=''});render();drawMarkers()};$('csv').onchange=async e=>{let f=e.target.files[0];if(f)parseCsv(await f.text())};
</script></body></html>
